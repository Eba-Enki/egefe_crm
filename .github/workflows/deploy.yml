name: Deploy to cPanel (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via FTP (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_SERVER" <<'LFTP'
          set ftp:ssl-allow false
          set net:timeout 30
          set net:max-retries 3
          mirror -R --delete \
            --exclude-glob ".git*" \
            --exclude "^\.github/" \
            --exclude "^\.claude/" \
            --exclude "^node_modules/" \
            --exclude "^sql/" \
            --exclude "^temporary screenshots/" \
            --exclude "^api/setup/" \
            --exclude "^config/db\.local\.php$" \
            --exclude "^CLAUDE\.md$" \
            --exclude "^serve\.mjs$" \
            --exclude "^screenshot\.mjs$" \
            ./ ./
          bye
          LFTP
