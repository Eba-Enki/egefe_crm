<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>EGEFE CRM - İlk Kurulum</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:420px;margin:60px auto;padding:0 20px;color:#222}
  h1{font-size:1.3rem}
  label{display:block;margin:14px 0 4px;font-weight:600}
  input{width:100%;padding:8px;box-sizing:border-box;border:1px solid #ccc;border-radius:4px}
  button{margin-top:20px;padding:10px 18px;background:#222;color:#fff;border:none;border-radius:4px;cursor:pointer}
  #msg{margin-top:16px;font-weight:600}
</style>
</head>
<body>
<h1>İlk Yönetici Hesabını Oluştur</h1>
<p>Bu form yalnızca veritabanında hiç kullanıcı yokken çalışır.</p>
<form id="f">
  <label>Ad Soyad</label>
  <input name="ad" required>
  <label>Kullanıcı Adı</label>
  <input name="username" required>
  <label>E-posta</label>
  <input name="email" type="email">
  <label>Şifre (en az 8 karakter)</label>
  <input name="password" type="password" minlength="8" required>
  <button type="submit">Oluştur</button>
</form>
<div id="msg"></div>
<script>
document.getElementById('f').addEventListener('submit', async function(e){
  e.preventDefault();
  var data = Object.fromEntries(new FormData(e.target).entries());
  var res = await fetch('create_admin.php', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(data)
  });
  var json = await res.json();
  var msg = document.getElementById('msg');
  if(res.ok){
    msg.style.color='green';
    msg.textContent='Başarılı! Kullanıcı oluşturuldu (id: '+json.id+'). Şimdi bu klasördeki dosyaları silebilirsiniz.';
    e.target.style.display='none';
  } else {
    msg.style.color='red';
    msg.textContent='Hata: '+json.error;
  }
});
</script>
</body>
</html>
